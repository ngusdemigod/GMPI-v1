server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;
    
    # PHP files - handle all PHP files
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # Serve static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Serve src directory
    location /src {
        alias /var/www/html/src;
        try_files $uri $uri/ /src/index.php?$query_string;
    }
    
    # Serve admin directory
    location /admin {
        alias /var/www/html/admin;
        try_files $uri $uri/ /admin/index.php?$query_string;
    }
    
    # Serve root files
    location = / {
        try_files $uri $uri/ /src/index.php?$query_string;
    }

    # Local/simple Paystack webhook route
    location = /paystack/webhook {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/paystack_webhook.php;
        fastcgi_pass php:9000;
    }

    # Full Paystack webhook route for app-side processing
    location = /paystack/webhook/live {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/paystack_live_webhook.php;
        fastcgi_pass php:9000;
    }
    
    # Catch-all for other paths
    location / {
        try_files $uri $uri/ /src/index.php?$query_string;
    }
    
    location ~ /\.ht {
        deny all;
    }
}
