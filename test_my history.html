<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Giving History</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        cream: '#FAF6EF',
        ink: '#0F1B2D',
        gold: '#C9A24B',
        goldsoft: '#E7D9B4',
        deep: '#122137',
        sage: '#5B7B6A',
      },
      fontFamily: {
        serif: ['"Fraunces"', 'ui-serif'],
        sans: ['"Inter"', 'ui-sans-serif'],
      }
    }
  }
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Fraunces&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; background:#FAF6EF; }
.font-serif { font-family: 'Fraunces', serif; }
</style>
</head>

<body class="min-h-screen text-ink">

<!-- NAV -->
<nav class="sticky top-0 bg-cream/80 backdrop-blur border-b border-ink/10">
  <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">

    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-deep flex items-center justify-center text-gold font-bold">G</div>
      <p class="font-serif text-lg">Bright Light Ministry Int'l</p>
    </div>

    <div class="hidden md:flex gap-6 text-sm">
      <a href="/" class="text-ink/70">Home</a>
      <a href="#" class="text-ink/70">Give</a>
      <a href="#" class="text-ink/70">Campaigns</a>
      <a href="/history.html" class="font-medium">My History</a>
    </div>

  </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-10">

<!-- HEADER -->
<section class="mb-10">
  <h1 class="font-serif text-4xl md:text-5xl">
    Your Giving History
  </h1>
  <p class="text-ink/60 mt-2">
    Every seed you've sown, recorded with purpose.
  </p>
</section>

<!-- SUMMARY -->
<div class="grid md:grid-cols-3 gap-5 mb-8">

  <div class="bg-white p-5 rounded-2xl border">
    <p class="text-xs text-ink/50">Total Given</p>
    <h3 class="font-serif text-2xl">$4,820</h3>
  </div>

  <div class="bg-white p-5 rounded-2xl border">
    <p class="text-xs text-ink/50">Transactions</p>
    <h3 class="font-serif text-2xl">28</h3>
  </div>

  <div class="bg-white p-5 rounded-2xl border">
    <p class="text-xs text-ink/50">This Month</p>
    <h3 class="font-serif text-2xl">$750</h3>
  </div>

</div>

<!-- FILTERS -->
<div class="bg-white border border-ink/10 rounded-2xl p-4 flex flex-wrap gap-3 items-center justify-between mb-6">

  <input id="search"
    type="text"
    placeholder="Search..."
    class="px-4 py-2 rounded-xl border text-sm w-full md:w-64"
  />

  <div class="flex gap-2">
    <button class="filter px-4 py-2 border rounded-full text-sm" data-type="all">All</button>
    <button class="filter px-4 py-2 border rounded-full text-sm" data-type="tithe">Tithe</button>
    <button class="filter px-4 py-2 border rounded-full text-sm" data-type="offering">Offering</button>
    <button class="filter px-4 py-2 border rounded-full text-sm" data-type="missions">Missions</button>
  </div>

  <input id="date" type="date" class="px-3 py-2 border rounded-lg text-sm"/>

</div>

<!-- TABLE -->
<div class="bg-white rounded-3xl border border-ink/10 overflow-hidden">

  <div class="grid grid-cols-4 px-6 py-4 text-xs uppercase text-ink/50 border-b">
    <span>Type</span>
    <span>Date</span>
    <span>Method</span>
    <span class="text-right">Amount</span>
  </div>

  <div id="transactions"></div>

</div>

<!-- EMPTY STATE -->
<p id="emptyState" class="hidden text-center text-ink/50 py-10">
  No transactions found.
</p>

</main>

<script>

// MOCK DATA (replace with Supabase later)
const transactions = [
  {type:'tithe', date:'2024-11-10', method:'Visa •4829', amount:250},
  {type:'missions', date:'2024-11-05', method:'Bank Transfer', amount:500},
  {type:'offering', date:'2024-11-03', method:'Card', amount:1000},
  {type:'tithe', date:'2024-10-27', method:'Visa •4829', amount:250},
];

let filtered = [...transactions];

function render(data) {
  const container = document.getElementById('transactions');
  const empty = document.getElementById('emptyState');

  container.innerHTML = '';

  if (data.length === 0) {
    empty.classList.remove('hidden');
    return;
  }

  empty.classList.add('hidden');

  data.forEach(tx => {
    container.innerHTML += `
      <div class="grid grid-cols-4 px-6 py-4 items-center border-b hover:bg-cream/50">
        <span class="capitalize font-medium">${tx.type}</span>
        <span class="text-sm text-ink/60">${new Date(tx.date).toDateString()}</span>
        <span class="text-sm text-ink/60">${tx.method}</span>
        <span class="text-right font-serif">$${tx.amount}</span>
      </div>
    `;
  });
}

render(filtered);

// SEARCH
document.getElementById('search').addEventListener('input', e => {
  const val = e.target.value.toLowerCase();
  filtered = transactions.filter(tx =>
    tx.type.includes(val) || tx.method.toLowerCase().includes(val)
  );
  render(filtered);
});

// FILTER
document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.type;
    filtered = type === 'all'
      ? transactions
      : transactions.filter(tx => tx.type === type);
    render(filtered);
  });
});

// DATE FILTER
document.getElementById('date').addEventListener('change', e => {
  const val = e.target.value;
  filtered = transactions.filter(tx => tx.date === val);
  render(filtered);
});

</script>

</body>
</html>
